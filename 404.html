<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Devero</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    @font-face {
      font-family: 'Barlow Condensed';
      src: url('/assets/fonts/BarlowCondensed-ExtraBold.woff2') format('woff2');
      font-weight: 800;
      font-display: swap;
    }

    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-content: center;
      gap: 12px;
      padding: 16px;
      box-sizing: border-box;
      background: #111214;
      color: #ecedee;
      font-family: 'Barlow Condensed', system-ui, sans-serif;
      font-weight: 800;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 2.2rem;
      letter-spacing: 0.24em;
      padding-left: 0.24em;
    }

    p {
      margin: 0;
      color: #a0a4ab;
      font-size: 1.3rem;
    }
  </style>
</head>
<body>
  <h1>DEVERO</h1>
  <p>Coming soon</p>

</html>
